services:
  api:
    build: .
    container_name: task-management-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: task-management-db
    environment:
      POSTGRES_DB: task_management_db
      POSTGRES_USER: task_management_user
      POSTGRES_PASSWORD: admin_mahamud
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_management_user -d task_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: